<script>(()=>{const world=document.querySelector('#world'),rabbit=document.querySelector('#rabbit'),toast=document.querySelector('#toast'),decor=document.querySelector('#decorations'),panel=document.querySelector('#panel'),coinsEl=document.querySelector('#coins');const s={x:700,y:650,coins:3,keys:{up:false,down:false,left:false,right:false},plots:[0,0,0,0,0],last:0,day:1,season:0};const seasons=[{name:'春',cls:'season-spring',weather:'微風與花香',trees:'🌸'},{name:'夏',cls:'season-summer',weather:'晴朗的午後',trees:'🌳'},{name:'秋',cls:'season-autumn',weather:'落葉輕輕飄落',trees:'🍂'},{name:'冬',cls:'season-winter',weather:'清冷的雪日',trees:'🌲'}];function applySeason(){world.classList.remove('season-spring','season-summer','season-autumn','season-winter');world.classList.add(seasons[s.season].cls);document.querySelector('.title-text small').textContent='第 '+s.day+' 天・'+seasons[s.season].name+'季｜'+seasons[s.season].weather;}function saveSeason(){try{localStorage.setItem('rabbitFarmDemoV11',JSON.stringify({day:s.day,season:s.season,plots:s.plots,coins:s.coins}))}catch(e){}}const W=1800,H=1500,speed=235;const items=[[90,120,'🌳','tree'],[500,100,'🌳','tree'],[850,130,'🌲','tree'],[1250,120,'🌳','tree'],[1580,180,'🌳','tree'],[120,750,'🌼',''],[210,830,'🌸',''],[330,690,'🌿',''],[470,920,'🌼',''],[590,520,'🌸',''],[1000,210,'🌿',''],[1130,280,'🌼',''],[1450,480,'🌸',''],[1530,600,'🌼',''],[1650,780,'🌿',''],[250,1120,'🌳','tree'],[430,1250,'🌼',''],[760,1180,'🌸',''],[1200,1100,'🌳','tree'],[1500,1250,'🌳','tree'],[700,370,'🪨',''],[590,1040,'🍄',''],[950,980,'🪨',''],[1410,920,'🦋',''],[300,520,'🐦','']];items.forEach(([x,y,t,c])=>{let e=document.createElement('div');e.className='decor '+c;e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';decor.appendChild(e)});function say(t){toast.textContent=t;toast.style.opacity='1';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.opacity='.4',2800)}function camera(){
