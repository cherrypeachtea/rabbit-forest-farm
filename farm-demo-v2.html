<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e8efd9"><title>兔兔的森林農場日記｜繪本試玩版</title>
<style>
:root{--ink:#5d5947;--cream:#fff8e8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8efd9;font-family:ui-rounded,"PingFang TC",system-ui,sans-serif;color:var(--ink);touch-action:none}#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#e9f1e2,#f5f0dc 55%,#d4dfbc)}#world{position:absolute;width:1800px;height:1500px;left:0;top:0;overflow:hidden;background:radial-gradient(ellipse at 12% 18%,#e4e9cb 0 12%,transparent 13%),radial-gradient(ellipse at 85% 22%,#dce7c9 0 14%,transparent 15%),linear-gradient(165deg,#dce8ce,#c9d9b3 55%,#b7c99e)}#world:before{content:"";position:absolute;inset:0;opacity:.25;background-image:radial-gradient(#fff9df 1px,transparent 1.5px),radial-gradient(#7b966b 1px,transparent 1.5px);background-size:37px 39px,51px 47px;background-position:0 0,17px 12px}.hill{position:absolute;border-radius:50%;opacity:.65}.one{width:900px;height:300px;background:#b8cda5;left:-160px;top:160px;transform:rotate(-9deg)}.two{width:1000px;height:320px;background:#c3d4ad;right:-100px;top:220px;transform:rotate(8deg)}.path{position:absolute;left:735px;top:-100px;width:245px;height:1700px;background:#e8d6ad;border:8px solid #d7c49b;border-left-color:#f2e4c6;border-right-color:#d5c093;border-radius:48% 44% 45% 50%;transform:rotate(14deg);box-shadow:inset 0 0 0 5px #efdfbd}.path:after{content:"";position:absolute;inset:0;background-image:radial-gradient(ellipse,#bca780 0 2px,transparent 3px),radial-gradient(ellipse,#fff0d2 0 2px,transparent 3px);background-size:69px 83px,91px 111px;background-position:8px 21px,35px 50px;opacity:.7}.decor{position:absolute;transform:translate(-50%,-50%);font-size:40px;filter:drop-shadow(0 3px 1px #687a4b35);user-select:none}.tree{font-size:82px}#cottage{position:absolute;left:390px;top:230px;font-size:118px;filter:drop-shadow(0 7px 2px #6d76543d);z-index:3}.sign{position:absolute;left:455px;top:365px;background:#fff7dfdc;border:2px solid #cbbd92;border-radius:13px;padding:7p #bd8e86}#rabbit .coat{position:absolute;left:18px;top:57px;width:61px;height:52px;background:#7393a0;border:2px solid #577784;border-radius:19px 19px 13px 13px;z-index:4}#rabbit .coat:before{content:"";position:absolute;left:27px;top:0;height:100%;border-left:2px solid #d9e2d6}#rabbit .foot{position:absolute;bottom:5px;width:27px;height:15px;border-radius:60%;background:#f9f0dc;border:2px solid #b7a98b;z-index:5}#rabbit .foot.left{left:14px}#rabbit .foot.right{right:10px}#rabbit.walk .foot.left{animation:step .18s infinite alternate}#rabbit.walk .foot.right{animation:step .18s infinite alternate-reverse}@keyframes step{to{transform:translateY(-5px) rotate(9deg)}}#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;z-index:20;padding:12px 14px;pointer-events:none}.title-card{display:flex;align-items:center;gap:10px;max-width:520px;margin:auto;background:#fff9ebdf;border:1px solid #d8cba8;border-radius:18px;padding:10px 13px;box-shadow:0 4px 12px #64724b15}.mini-rabbit{font-size:33px}.title-text{flex:1;min-width:0}.title-text strong{display:block;font-size:17px}.title-text small{font-size:12px;color:#8a8069}.coins{background:#fff1c9;border:1px solid #e2d0a0;border-radius:18px;padding:7px 10px;font-size:13px;white-space:nowrap}#toast{position:fixed;z-index:30;top:90px;left:50%;transform:translateX(-50%);background:#fff8e7ed;border:1px solid #d8c89d;border-radius:16px;padding:10px 15px;box-shadow:0 5px 14px #52604425;font-size:14px;max-width:90vw;text-align:center;transition:opacity .3s}#controls{position:fixed;z-index:25;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px;pointer-events:none}.pad{width:146px;height:146px;position:relative;pointer-events:auto;touch-action:none}.ring{position:absolute;inset:0;border-radius:50%;background:#fff6e0c9;border:2px solid #b9bd91;box-shadow:0 4px 0 #8e9b6c50}.pad button{position:absolute;width:44px;height:44px;border:1px solid #d2c49c;border-radius:14px;background:#fff9e8ef;color:#5f6c4b;font-size:24px;display:grid;place-items:center;box-shadow:0 3px 0 #c3b58f;touch-action:none}.up{left:51px;top:8px}.down{left:51px;bottom:8px}.left{left:8px;top:51px}.right{right:8px;top:51px}.actions{display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:auto}.action{border:1px solid #d2c49c;border-radius:16px;background:#fff8e8ef;color:#5e6448;padding:11px 12px;font-size:13px;box-shadow:0 3px 0 #c3b58f;min-width:105px}.action.primary{background:#e3edcf}#help{position:fixed;z-index:20;bottom:calc(env(safe-area-inset-bottom,0px) + 172px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff8e8d9;border:1px solid #d8cba8;border-radius:20px;padding:7px 12px;font-size:12px;color:#756c55;pointer-events:none}#panel{position:fixed;z-index:40;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:#fff9eb;border:2px solid #d8cba8;border-radius:22px;padding:16px;box-shadow:0 10px 35px #46533b40;display:none}#panel h2{font-size:18px;margin:0 0 8px}#panel p{font-size:14px;line-height:1.6;margin:0 0 12px}.panel-actions{display:flex;gap:8px;flex-wrap:wrap}.panel-actions button{border:1px solid #c8bd99;border-radius:12px;padding:10px 12px;background:#e5edcf;color:#5b654a}#closePanel{float:right;border:0;background:transparent;font-size:22px;color:#776e59}@media(min-width:700px){#controls{max-width:900px;margin:auto;left:50%;right:auto;width:100%;transform:translateX(-50%)}#help{bottom:190px}}
</style></head><body><div id="game"><div id="world"><div class="hill one"></div><div class="hill two"></div><div class="path"></div><div id="cottage">🏡</div><div class="sign">小兔的家</div><div class="decor" style="left:100px;top:460px">🪵 ─ 🪵 ─ 🪵 ─ 🪵</div><div class="decor" style="left:1400px;top:400px">🪵 ─ 🪵 ─ 🪵</div><div id="garden"><div class="bed-title">🥕 小小菜圃</div><button class="plot" style="left:30px;top:36px" data-plot="0"><span>🌱</span></button><button class="plot" style="left:130px;top:30px" data-plot="1"><span>🌱</span></button><button class="plot" style="left:235px;top:30px" data-plot="2"><span>🌱</span></button><button class="plot" style="left:75px;top:155px" data-plot="3"><span>🌱</span></button><button class="plot" style="left:185px;top:155px" data-plot="4"><span>🌱</span></button></div><div id="decorations"></div><div id="rabbit"><div class="shadow"></div><div class="body"></div><div class="head"><div class="ear left"></div><div class="ear right"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div></div><div class="coat"></div><div class="foot left"></div><div class="foot right"></div></div></div></div><header id="hud"><div class="title-card"><div class="mini-rabbit">🐰</div><div class="title-text"><strong>兔兔的森林農場日記</strong><small>沿著小路，開始今天的冒險。</small></div><div class="coins">🥕 <span id="coins">3</span></div></div></header><div id="toast">早安！用方向鍵帶兔兔去看看菜圃吧 🌱</div><div id="help">按住方向鍵移動・點選菜圃照顧植物</div><div id="controls"><div class="pad" id="pad"><div class="ring"></div><button class="up" data-dir="up">↑</button><button class="down" data-dir="down">↓</button><button class="left" data-dir="left">←</button><button class="right" data-dir="right">→</button></div><div class="actions"><button class="action primary" id="interact">🌱 照顧菜圃</button><button class="action" id="home">🏡 回到小屋</button></div></div><div id="panel"><button id="closePanel">×</button><h2 id="panelTitle">小小菜圃</h2><p id="panelText"></p><div class="panel-actions" id="panelActions"></div></div>
<script>(()=>{const world=document.querySelector('#world'),rabbit=document.querySelector('#rabbit'),toast=document.querySelector('#toast'),decor=document.querySelector('#decorations'),panel=document.querySelector('#panel'),coinsEl=document.querySelector('#coins');const s={x:700,y:590,coins:3,keys:{up:false,down:false,left:false,right:false},plots:[0,0,0,0,0],last:0};const W=1800,H=1500,speed=235;const items=[[90,120,'🌳','tree'],[500,100,'🌳','tree'],[850,130,'🌲','tree'],[1250,120,'🌳','tree'],[1580,180,'🌳','tree'],[120,750,'🌼',''],[210,830,'🌸',''],[330,690,'🌿',''],[470,920,'🌼',''],[590,520,'🌸',''],[1000,210,'🌿',''],[1130,280,'🌼',''],[1450,480,'🌸',''],[1530,600,'🌼',''],[1650,780,'🌿',''],[250,1120,'🌳','tree'],[430,1250,'🌼',''],[760,1180,'🌸',''],[1200,1100,'🌳','tree'],[1500,1250,'🌳','tree'],[700,370,'🪨',''],[590,1040,'🍄',''],[950,980,'🪨',''],[1410,920,'🦋',''],[300,520,'🐦','']];items.forEach(([x,y,t,c])=>{let e=document.createElement('div');e.className='decor '+c;e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';decor.appendChild(e)});function say(t){toast.textContent=t;toast.style.opacity='1';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.opacity='.4',2800)}function camera(){let vw=innerWidth,vh=innerHeight,cx=Math.max(vw/2,Math.min(W-vw/2,s.x)),cy=Math.max(vh/2,Math.min(H-vh/2,s.y));world.style.left=(vw/2-cx)+'px';world.style.top=(vh/2-cy)+'px';world.style.transform='none'}function move(dt){let dx=(s.keys.right?1:0)-(s.keys.left?1:0),dy=(s.keys.down?1:0)-(s.keys.up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);s.x=Math.max(55,Math.min(W-55,s.x+dx/l*speed*dt));s.y=Math.max(70,Math.min(H-60,s.y+dy/l*speed*dt));rabbit.classList.add('walk');rabbit.style.transform=`translate(-50%,-50%) scaleX(${dx<0?-1:1})`}else rabbit.classList.remove('walk');rabbit.style.left=s.x+'px';rabbit.style.top=s.y+'px';camera()}function loop(t){let dt=Math.min((t-s.last)/1000||0,.04);s.last=t;move(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);function dir(d,on){s.keys[d]=on}document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);dir(d,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>dir(d,false)))});window.addEventListener('keydown',e=>{let m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(m[e.key]){e.preventDefault();dir(m[e.key],true)}});window.addEventListener('keyup',e=>{let m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(m[e.key])dir(m[e.key],false)});window.addEventListener('blur',()=>Object.keys(s.keys).forEach(k=>s.keys[k]=false));window.addEventListener('resize',camera);const plots=[...document.querySelectorAll('.plot')];function openPlot(i){let lv=s.plots[i];document.querySelector('#panelTitle').textContent='小小菜圃';document.querySelector('#panelText').textContent=['土地還空著。要種下紅蘿蔔種子嗎？','小苗正在長大，給它一點水吧！','葉子長得真好，再照顧一下就能收成囉。','紅蘿蔔成熟了，可以收成！'][lv];let a=document.querySelector('#panelActions');a.innerHTML='';let b=document.createElement('button');b.textContent=['🥕 播種（免費）','💧 澆水','☀️ 繼續照顧','🧺 收成 +2'][lv];b.onclick=()=>{if(lv<3){s.plots[i]++;plots[i].querySelector('span').textContent=['🌱','🌿','🥕'][s.plots[i]-1];plots[i].classList.add('ready');say(['','小苗喝飽水，精神好多了！','紅蘿蔔成熟啦！'][lv+1]||'種下種子了！')}else{s.plots[i]=0;s.coins+=2;coinsEl.textContent=s.coins;plots[i].querySelector('span').textContent='🌱';say('收成了兩枚胡蘿蔔幣！')}panel.style.display='none';try{localStorage.setItem('rabbitFarmDemo',JSON.stringify({plots:s.plots,coins:s.coins}))}catch(e){}};a.appendChild(b);panel.style.display='block'}plots.forEach((b,i)=>b.onclick=()=>openPlot(i));document.querySelector('#closePanel').onclick=()=>panel.style.display='none';document.querySelector('#interact').onclick=()=>{let i=s.plots.indexOf(0);if(i<0)i=0;openPlot(i)};document.querySelector('#home').onclick=()=>{s.x=360;s.y=350;say('回到小屋旁邊休息一下吧 🏡')};try{let v=JSON.parse(localStorage.getItem('rabbitFarmDemo')||'null');if(v&&Array.isArray(v.plots)){s.plots=v.plots;s.coins=v.coins||3;coinsEl.textContent=s.coins;plots.forEach((b,i)=>{b.querySelector('span').textContent=['🌱','🌿','🥕','🥕'][s.plots[i]]||'🌱';if(s.plots[i])b.classList.add('ready')})}}catch(e){}camera()})();</script></body></html>
