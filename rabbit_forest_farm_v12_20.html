/* v6: iPhone touch safety and consistent illustrated scene */
html,body,#game,#world,.decor,#rabbit,#controls,#controls button,#help,#hud,#toast{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
button{ -webkit-tap-highlight-color:transparent; }
#world{touch-action:none}
/* v5: gentler 2D storybook presentation */
#world{will-change:left,top;background:radial-gradient(ellipse at 12% 18%,#e7ebd1 0 12%,transparent 13%),radial-gradient(ellipse at 85% 22%,#dce7c9 0 14%,transparent 15%),linear-gradient(165deg,#e1e9d2,#cbdab8 55%,#b8c99f)}
.path{box-shadow:inset 0 0 0 3px #efdfbd,0 0 0 1px #cfbc94}
.plot{cursor:pointer;touch-action:manipulation;transition:filter .15s,transform .15s}
.plot:active{filter:brightness(1.08);transform:scale(.97)}
.storybook-cottage,.storybook-fence,.storybook-flower,.storybook-bush{pointer-events:none}

/* v12: real-world clock ambience; overlay never blocks controls */
#game::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 2s ease}
#game.time-dawn::after{opacity:.10;background:linear-gradient(180deg,#f7b77b55,#ffe5b255)}
#game.time-day::after{opacity:0}
#game.time-evening::after{opacity:.20;background:linear-gradient(180deg,#e7a0a755,#efb76b33)}
#game.time-night::after{opacity:.10;background:linear-gradient(180deg,#253b6522,#344e7522)}
#game.time-night #world{filter:saturate(.78) brightness(.76)}
#game.time-evening #world{filter:saturate(.9) brightness(.91)}
#game.time-dawn #world{filter:saturate(.92) brightness(.98)}
.placing-hint{position:fixed;z-index:35;left:50%;top:145px;transform:translateX(-50%);padding:9px 13px;border-radius:14px;background:#fff8e8ed;border:1px solid #d8cba8;color:#655d48;font-size:13px;display:none;white-space:nowrap;pointer-events:none}

/* v12.7: real-time dawn/day/dusk/night and gentle weather overlays */
#game.time-dawn #world{filter:saturate(.92) brightness(1.02)}
#game.time-day #world{filter:saturate(1.02) brightness(1)}
#game.time-evening #world{filter:saturate(.92) sepia(.12) brightness(.94)}
#game.time-night #world{filter:saturate(.82) brightness(.84) hue-rotate(3deg)}
#weather-effects{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 2s ease}
#weather-effects.weather-rain{opacity:.88;background:none}
#weather-effects.weather-snow{opacity:.82;background:none}
#weather-particles{display:block;width:100%;height:100%;}
#weather-effects.weather-clear{opacity:0}
#weather-effects.weather-rain:after{content:"";position:absolute;inset:0;background:rgba(110,133,150,.02)}
/* v12.8: visible sky band, distinct from the farm ground */
#sky-backdrop{position:fixed;left:0;right:0;top:0;height:48vh;z-index:13;pointer-events:none;opacity:.88;transition:background 2s ease,opacity 2s ease;mix-blend-mode:screen;background:linear-gradient(180deg,#f4c5a0 0%,#f8dfb8 48%,rgba(248,223,184,0) 100%)}
#game.time-dawn #sky-backdrop{background:linear-gradient(180deg,#eab0b0 0%,#f7d5b0 40%,rgba(247,213,176,0) 100%);opacity:.82}
#game.time-day #sky-backdrop{background:linear-gradient(180deg,#8fc5e8 0%,#c7e4e8 48%,rgba(199,228,232,0) 100%);opacity:.38}
#game.time-evening #sky-backdrop{background:linear-gradient(180deg,#7d6b9e 0%,#e7a18e 40%,#f7cf9b 68%,rgba(247,207,155,0) 100%);opacity:.9;mix-blend-mode:normal}
#game.time-night #sky-backdrop{background:linear-gradient(180deg,#101d43 0%,#243e70 42%,#526487 76%,rgba(82,100,135,0) 100%);opacity:.92;mix-blend-mode:normal}
#sky-stars{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;transition:opacity 2s ease;background-image:radial-gradient(2px 2px at 12% 18%,#fff8d7 50%,transparent 100%),radial-gradient(1.5px 1.5px at 31% 12%,#fff 50%,transparent 100%),radial-gradient(2px 2px at 57% 21%,#fff3c8 50%,transparent 100%),radial-gradient(1.5px 1.5px at 78% 15%,#fff 50%,transparent 100%),radial-gradient(2px 2px at 89% 31%,#fff8d7 50%,transparent 100%),radial-gradient(1px 1px at 42% 29%,#fff 50%,transparent 100%),radial-gradient(1.5px 1.5px at 68% 8%,#fff 50%,transparent 100%)}
#sky-stars:after{content:"☾";position:absolute;right:15%;top:13%;font-size:34px;color:#fff1bd;text-shadow:0 0 18px #fff0b8;opacity:.9}
#game.time-night #sky-stars{opacity:.9}
#game.time-dawn #sky-stars{opacity:.12}
#game.time-evening #sky-stars{opacity:.22}
#weather-label{position:fixed;z-index:21;top:calc(env(safe-area-inset-top,0px) + 74px);right:14px;padding:5px 9px;border-radius:14px;background:#fff8e8d9;border:1px solid #d8cba8;font-size:12px;pointer-events:none;color:#6b624d}
@keyframes rainfall{from{background-position:0 -180px}to{background-position:0 0}}
@keyframes snowfall{from{background-position:0 -120px,20px -160px,10px -90px}to{background-position:35px 100vh,-25px 110vh,45px 95vh}}

/* v12.9: keep night ambience in the sky, not over the cottage and rabbit */
#game.time-night #world{filter:saturate(.96) brightness(1) hue-rotate(0deg)}
#game.time-evening #world{filter:saturate(.98) brightness(1)}
#game.time-dawn #world{filter:saturate(.98) brightness(1)}
/* v12.10: soften the sky overlay so cottage and rabbit remain readable */
#sky-backdrop{height:30vh;mix-blend-mode:normal;opacity:.42;}
#game.time-night #sky-backdrop{height:31vh;background:linear-gradient(180deg,rgba(16,29,67,.78) 0%,rgba(36,62,112,.62) 38%,rgba(82,100,135,.28) 66%,rgba(82,100,135,0) 100%);opacity:1}

#game.time-day #sky-backdrop{height:30vh;background:linear-gradient(180deg,rgba(143,197,232,.28) 0%,rgba(199,228,232,.18) 48%,rgba(199,228,232,0) 100%);opacity:1}
#sky-stars{height:30vh;bottom:auto}

/* v12.15: tighten sprite crop to remove stray pixels beneath the rabbit's feet. */
#rabbit{clip-path:inset(0 0 9px 0);}

#sky-backdrop{height:24vh;}
